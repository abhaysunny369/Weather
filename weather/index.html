<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

```
<title>Weather Forecast</title>

<!-- CSS file -->
<link rel="stylesheet" href="./weather.css">

<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
```

</head>

<body>

```
<div id="main" class="d-flex align-items-center justify-content-center flex-column">

    <h1>WEATHER FORECAST</h1>

    <!-- Search city -->
    <div class="d-flex">
        <input id="inputcity" placeholder="Enter the city" class="form-control">

        <button class="btn btn-success" id="search">Search</button>
    </div>

    <!-- Weather information appears here -->
    <div id="weatherOutput"></div>

</div>

<script>

    document.getElementById("search").addEventListener("click", () => {

        let city = document.getElementById("inputcity").value.trim();

        if (city === "") {
            alert("Please enter a city name");
            return;
        }

        fetch(`https://api.openweathermap.org/data/2.5/weather?q=${encodeURIComponent(city)}&appid=5b4bee0ba241d092159faf007e166080&units=metric`)

            .then((res) => {

                if (!res.ok) {
                    throw new Error("City not found or API error");
                }

                return res.json();

            })

            .then((weatherData) => {

                console.log(weatherData);

                document.getElementById("weatherOutput").innerHTML = `

                    <div class="weather-card">

                        <div class="weather-top">

                            <div>
                                <h2>${weatherData.name}</h2>

                                <h1>${weatherData.main.temp}°C</h1>

                                <p>
                                    Feels like: ${weatherData.main.feels_like}°C
                                </p>

                                <p>
                                    ${weatherData.weather[0].description}
                                </p>
                            </div>

                        </div>

                        <div class="weather-details">

                            <div class="detail-box">
                                <p>Humidity</p>
                                <h4>${weatherData.main.humidity}%</h4>
                            </div>

                            <div class="detail-box">
                                <p>Wind Speed</p>
                                <h4>${weatherData.wind.speed} m/s</h4>
                            </div>

                            <div class="detail-box">
                                <p>Pressure</p>
                                <h4>${weatherData.main.pressure} hPa</h4>
                            </div>

                            <div class="detail-box">
                                <p>Visibility</p>
                                <h4>${weatherData.visibility / 1000} km</h4>
                            </div>

                            <div class="detail-box">
                                <p>Ground Level</p>
                                <h4>${weatherData.main.grnd_level || "N/A"} hPa</h4>
                            </div>

                            <div class="detail-box">
                                <p>Cloudiness</p>
                                <h4>${weatherData.clouds.all}%</h4>
                            </div>

                        </div>

                    </div>

                `;

            })

            .catch((error) => {

                console.log(error);

                document.getElementById("weatherOutput").innerHTML = `
                    <h3 class="text-white mt-4">${error.message}</h3>
                `;

            });

    });

    // Search when the Enter key is pressed
    document.getElementById("inputcity").addEventListener("keydown", (event) => {

        if (event.key === "Enter") {
            document.getElementById("search").click();
        }

    });

</script>


</body>

</html>
